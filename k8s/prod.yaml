apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-logstash
  template:
    metadata:
      labels:
        app: spring-logstash
    spec:
      containers:
        - name: spring-logstash
          image: lucasgalo/spring-logstash:0.1.0   # substitua pela sua imagem
          ports:
            - containerPort: 8484
---
apiVersion: v1
kind: Service
metadata:
  name: spring-logstash
spec:
  type: NodePort
  selector:
    app: spring-logstash
  ports:
    - port: 8484        # porta interna do pod
      targetPort: 8484  # porta do container
      nodePort: 30084   # porta externa válida (faixa 30000–32767)
      protocol: TCP
      name: http
